name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"

      # --edge (the rolling main build) because the nightly is stale and
      # predates ADR 0135's instance-side supervisor configuration. Switch
      # back to --nightly once nightlies publish again (BT-3980).
      - name: Install Beamtalk
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Format check
        run: just fmt

      - name: Lint
        run: just lint
        continue-on-error: true

      - name: Build
        run: just build

      - name: Test
        run: just test
